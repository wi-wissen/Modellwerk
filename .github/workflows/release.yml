name: Release apps

# Builds the app (without landing page) for Windows, Linux (Debian/Ubuntu) and Android.
# Push a tag like v0.2.0 to create a draft GitHub release with all installers,
# or run the workflow manually to get them as build artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
          - platform: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Modellwerk ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # Windows: the program itself also works without installing (the web pages
      # are inside the exe); it needs the WebView2 runtime that Windows 10/11 bring
      - name: Portable Windows exe
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: cp src-tauri/target/release/modellwerk.exe Modellwerk-portable.exe
      - name: Attach portable exe to draft release
        if: startsWith(matrix.platform, 'windows') && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Modellwerk-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: modellwerk-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            Modellwerk-portable.exe
          if-no-files-found: ignore

  # the app as one HTML file that runs offline from a USB stick or a school share
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:single
      - run: cp dist-single/index.html modellwerk-offline.html
      - uses: actions/upload-artifact@v4
        with:
          name: modellwerk-offline
          path: modellwerk-offline.html
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: modellwerk-offline.html

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # only platform-tools: the action's default list still names the removed
      # legacy package "tools", which makes sdkmanager fail
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      - name: Generate Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android init --ci

      # Optional signing: set the secrets ANDROID_KEYSTORE (base64), ANDROID_KEY_ALIAS
      # and ANDROID_KEY_PASSWORD. Without them the APK is built unsigned.
      - name: Configure signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          PROPS
          python3 scripts/android-signing.py

      - name: Build APK and AAB
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android build --apk --aab

      # Fixed names, so the website can link to releases/latest/download/<name>
      - name: Name the Android files
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk Modellwerk-android.apk
          cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab Modellwerk-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: modellwerk-android
          path: |
            Modellwerk-android.apk
            Modellwerk-android.aab

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Modellwerk-android.apk
            Modellwerk-android.aab
